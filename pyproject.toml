[project]
name = "tcl-mcp-server"
version = "0.1.0"
description = "MCP server that executes TCL commands over TCP on localhost:9020"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
tcl-mcp-server = "server:mcp"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
