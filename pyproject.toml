[project]
name = "tcl-mcp-server"
version = "0.2.0"
description = "OrCAD Capture Tcl MCP + PSpice helpers + MATLAB Engine MCP"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
matlab = ["matlabengine>=24.2.0"]
docs = ["python-docx>=1.0.0"]
plot = ["matplotlib>=3.7.0"]

[project.scripts]
tcl-mcp-server = "server:mcp"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "matlab_mcp", "sim_lib", "placement_lib"]
